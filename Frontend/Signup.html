<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="config.js"></script>
</head>
<body>
    <!-- Animated background elements -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Sign Up Form Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h2>Create Account</h2>
            </div>
            
            <p class="subtitle">Start tracking your expenses today!</p>
            
            <div id="message-box" style="display: none; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 15px; font-weight: 600;"></div>

            <form id="signupForm" action="#" method="POST" class="login-form">
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" placeholder="Create a password" required>
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">👁️</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="limit">Monthly Limit (₹)</label>
                    <!-- Type number allows them to enter their budget limit -->
                    <input type="number" id="limit" placeholder="E.g. 10000" min="0" step="1">
                </div>

                <button type="submit" class="btn-primary">Sign Up</button>
            </form>

            <p class="signup-prompt">
                Already have an account? <a href="index.html">Log in here</a>
            </p>
        </div>
    </div>

    <script>
        // Password toggle feature (same as login)
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Form Submission and Backend Connection
        const signupForm = document.getElementById('signupForm');
        const usernameInput = document.getElementById('username');
        const limitInput = document.getElementById('limit');
        const messageBox = document.getElementById('message-box');

        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const userName = usernameInput.value.trim();
            const passwordValue = passwordInput.value;
            // Convert limit string to a float number, or send null if they left it blank
            const limitValue = limitInput.value ? parseFloat(limitInput.value) : null;

            if (userName.length < 3) {
                showMessage("Username must be at least 3 characters.", "error");
                return;
            }
            if (passwordValue.length < 4) {
                showMessage("Password must be at least 4 characters.", "error");
                return;
            }

            try {
                const submitBtn = signupForm.querySelector('.btn-primary');
                const originalBtnText = submitBtn.textContent;
                submitBtn.textContent = "Creating Account...";
                submitBtn.disabled = true;

                // 2. Make the HTTP POST Request
                const response = await fetch(`${API_BASE_URL}/api/user`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userName: userName,
                        password: passwordValue,
                        limit: limitValue
                    })
                });

                // If Spring Boot successfully saved the user, it returns a 200 OK status
                if (response.ok) {
                    showMessage("Account created successfully! Redirecting to login...", "success");
                    
                    // Automatically send them to the login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    // This triggers if Spring Boot throws an error (e.g. if the username already exists)
                    showMessage("Failed to create account. Username might be taken.", "error");
                }
                
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Error connecting to backend:", error);
                showMessage("Could not connect to the server. Is Spring Boot running?", "error");
                
                const submitBtn = signupForm.querySelector('.btn-primary');
                submitBtn.textContent = "Sign Up";
                submitBtn.disabled = false;
            }
        });

        // Helper function to show beautiful error/success messages
        function showMessage(msg, type) {
            messageBox.style.display = "block";
            messageBox.textContent = msg;
            if (type === "error") {
                messageBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                messageBox.style.color = "#fca5a5"; 
                messageBox.style.border = "1px solid rgba(239, 68, 68, 0.5)";
            } else {
                messageBox.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                messageBox.style.color = "#6ee7b7"; 
                messageBox.style.border = "1px solid rgba(16, 185, 129, 0.5)";
            }
        }
    </script>
</body>
</html>
