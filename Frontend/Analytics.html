<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Analytics</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- This is the single line that downloads the entire Chart.js brain! -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    
    <style>
        .chart-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body class="dashboard-body">
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="dashboard-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">💸</span>
                <h2>Analytics</h2>
            </div>
            <div class="nav-actions">
                <button onclick="window.location.href='Dashboard.html'" class="btn-secondary">Back to Dashboard</button>
            </div>
        </nav>

        <main class="dashboard-main">
            
            <!-- NEW: Run-Rate Projection Card -->
            <div id="run-rate-card" class="glass-card" style="width: 100%; margin-bottom: 20px; display: none;">
                <h3 style="text-align: center;">Projected Spending This Month</h3>
                <h1 id="run-rate-amount" style="text-align: center; margin: 10px 0; font-size: 32px;">₹0</h1>
                <p id="run-rate-text" style="text-align: center; opacity: 0.8;"></p>
            </div>

            <div class="glass-card" style="width: 100%; margin-bottom: 20px;">
                <h3 style="text-align: center; margin-bottom: 20px;">Total Spending by Category</h3>
                
                <!-- This empty canvas is where the chart will be painted -->
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- NEW: Average Cost Bar Chart -->
            <div class="glass-card" style="width: 100%;">
                <h3 style="text-align: center; margin-bottom: 20px;">Average Cost per Transaction</h3>
                <div class="chart-container">
                    <canvas id="averageChart"></canvas>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = "Login.html";
        }

        async function loadAnalytics() {
            try {
                // 1. Fetch Run Rate Projection
                const runRateRes = await fetch(`${API_BASE_URL}/api/expenses/analytics/runrate/${userId}`);
                if (runRateRes.ok) {
                    const runRateData = await runRateRes.json();
                    updateRunRateUI(runRateData);
                }

                // 2. Fetch Total Spending (Doughnut)
                const totalRes = await fetch(`${API_BASE_URL}/api/expenses/analytics/${userId}`);
                if (totalRes.ok) {
                    const totalData = await totalRes.json();
                    renderChart(totalData);
                }

                // 3. Fetch Average Spending (Bar Chart)
                const avgRes = await fetch(`${API_BASE_URL}/api/expenses/analytics/average/${userId}`);
                if (avgRes.ok) {
                    const avgData = await avgRes.json();
                    renderAverageChart(avgData);
                }
            } catch (error) {
                console.error("Failed to load analytics", error);
            }
        }

        function updateRunRateUI(data) {
            const card = document.getElementById('run-rate-card');
            const amountEl = document.getElementById('run-rate-amount');
            const textEl = document.getElementById('run-rate-text');
            
            card.style.display = 'block'; // make it visible

            const projected = data.projectedTotal || 0;
            const limit = data.limit || 1;
            
            amountEl.innerText = `₹${projected.toFixed(2)}`;
            
            if (data.isOverLimit) {
                amountEl.style.color = '#ef4444'; // Red
                textEl.innerText = `Warning! At your current daily spending rate, you will exceed your ₹${limit} limit by ₹${(projected - limit).toFixed(2)}.`;
            } else {
                amountEl.style.color = '#10b981'; // Green
                textEl.innerText = `Good job! You are on track to stay under your ₹${limit} monthly limit.`;
            }
        }

        function renderAverageChart(data) {
            const ctx = document.getElementById('averageChart').getContext('2d');
            
            const categories = data.map(row => row[0] || 'Unknown');
            const amounts = data.map(row => row[1]);
            const colors = ['#3b82f6', '#14b8a6', '#f59e0b', '#8b5cf6', '#ef4444', '#10b981', '#ec4899', '#f97316'];

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: categories,
                    datasets: [{
                        label: 'Average Cost (₹)',
                        data: amounts,
                        backgroundColor: colors,
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y', // Makes the bar chart horizontal!
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#f8fafc', font: { family: "'Outfit'" } }
                        },
                        y: {
                            ticks: { color: '#f8fafc', font: { family: "'Outfit'" } }
                        }
                    }
                }
            });
        }

        function renderChart(data) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            // The Java List<Object[]> comes back as an array of arrays: [["Food", 2000], ["Transport", 500]]
            // We split it into two separate lists for the chart
            const categories = data.map(row => row[0] || 'Unknown');
            const amounts = data.map(row => row[1]);

            // Fun colors for the chart slices
            const colors = [
                '#10b981', '#3b82f6', '#f59e0b', '#ef4444', 
                '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
            ];

            // Tell Chart.js to paint!
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categories,
                    datasets: [{
                        label: 'Total Spent (₹)',
                        data: amounts,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 10 // Makes the slice pop out when you hover over it
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#f8fafc',
                                padding: 20,
                                font: {
                                    family: "'Outfit', sans-serif",
                                    size: 22
                                }
                            }
                        }
                    }
                }
            });
        }

        loadAnalytics();
    </script>
</body>
</html>
