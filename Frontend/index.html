<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Login</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Using a modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="config.js"></script>
</head>
<body>
    <!-- Animated background elements -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Login Form Container -->
    <div class="login-container">
        <div class="login-card">
            
            <div class="logo">
                <span class="logo-icon">💸</span>
                <h2>Expense Tracker</h2>
            </div>
            
            <p class="subtitle">Welcome back! Please enter your details.</p>
            
            <div id="message-box" style="display: none; padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-size: 15px; font-weight: 600;"></div>

            <form id="loginForm" action="#" method="POST" class="login-form">
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">👁️</button>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Log In</button>
            </form>

            <p class="signup-prompt">
                Don't have an account? <a href="Signup.html">Sign up for free</a>
            </p>

        </div>
    </div>

    <script>
        //show password code
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            
            // Toggle the eye icon emoji
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
        // Form Submission, Validation, and Backend Connection
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const messageBox = document.getElementById('message-box');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Stop the page from refreshing when you click submit!

            const userName = usernameInput.value.trim();
            const passwordValue = passwordInput.value;

            // 1. Client-Side Validation
            if (userName.length < 3) {
                showMessage("Username must be at least 3 characters long.", "error");
                return;
            }
            if (passwordValue.length < 4) {
                showMessage("Password must be at least 4 characters long.", "error");
                return;
            }

            // 2. Send to Spring Boot Backend
            try {
                // 2. Make the HTTP Request
                const response = await fetch(`${API_BASE_URL}/api/user/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userName: userName,
                        password: passwordValue
                    })
                });

                // We now expect JSON back from the server
                const result = await response.json(); 

                // 3. Handle the Response
                if (response.ok) {
                    showMessage(result.message, "success");
                    // Save the userId to the browser's local storage
                    localStorage.setItem('userId', result.userId);
                    
                    // Redirect them to the dashboard!
                    setTimeout(() => {
                        window.location.href = "Dashboard.html";
                    }, 1000);
                } else {
                    // "User NOT Found" or "Incorrect Password"
                    showMessage(result.message, "error");
                }
                
                // Reset button
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Error connecting to backend:", error);
                showMessage("Could not connect to the server.", "error");
                
                const submitBtn = loginForm.querySelector('.btn-primary');
                submitBtn.textContent = "Log In";
                submitBtn.disabled = false;
            }
        });

        // Helper function to show beautiful error/success messages
        function showMessage(msg, type) {
            messageBox.style.display = "block";
            messageBox.textContent = msg;
            if (type === "error") {
                messageBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
                messageBox.style.color = "#fca5a5"; // light red
                messageBox.style.border = "1px solid rgba(239, 68, 68, 0.5)";
            } else {
                messageBox.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                messageBox.style.color = "#6ee7b7"; // light green
                messageBox.style.border = "1px solid rgba(16, 185, 129, 0.5)";
            }
        }
    </script>
</body>
</html>
