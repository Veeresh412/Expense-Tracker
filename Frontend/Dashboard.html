<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="dashboard-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">💸</span>
                <h2>Expense Tracker</h2>
            </div>
            <div class="nav-actions">
                <span id="welcome-message">Welcome, User</span>
                <button id="logout-btn" class="btn-secondary">Log Out</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Top Section: Summary Cards -->
            <div class="summary-cards">
                <div class="glass-card summary-card">
                    <h3>Spent this Month</h3>
                    <h1 class="amount">₹15,450</h1>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 45%;"></div>
                    </div>
                    <p class="limit-text">45% of your ₹34,000 limit</p>
                </div>
                
                <div class="glass-card summary-card">
                    <h3>Quick Add Expense</h3>
                    <form id="addExpenseForm" class="quick-add-form">
                        <div class="input-row">
                            <input type="text" id="exp-desc" placeholder="Description" required>
                            <input type="number" id="exp-amount" placeholder="₹ Amount" min="0" step="1" required>
                        </div>
                        <div class="input-row">
                            <select id="exp-type" required>
                                <option value="DEBIT" selected>Debit (-)</option>
                                <option value="CREDIT">Credit (+)</option>
                            </select>
                            <input type="date" id="exp-date" required>
                        </div>
                        <div class="input-row">
                            <input type="text" id="exp-category" placeholder="Category (e.g. Food)" required>
                            <button type="submit" class="btn-primary">Add</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bottom Section: Transactions -->
            <div class="glass-card transactions-card">
                <h3>Recent Transactions</h3>
                <ul class="transaction-list" id="transaction-list">
                    <!-- Placeholder Data to show you how it looks -->
                    <li class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-icon">EN</div>
                            <div class="transaction-details">
                                <h4>Netflix Subscription</h4>
                                <span class="transaction-date">Yesterday</span>
                            </div>
                        </div>
                        <span class="transaction-amount" style="color: #ef4444;">-₹650</span>
                    </li>
                    <li class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-icon">OT</div>
                            <div class="transaction-details">
                                <h4>Split Bill (Rahul)</h4>
                                <span class="transaction-date">Monday</span>
                            </div>
                        </div>
                        <span class="transaction-amount" style="color: #10b981;">+₹1200</span>
                    </li>
                </ul>
            </div>
        </main>
    </div>

    <script>
        // Temporary logic for adding expenses to the UI before backend integration
        const addExpenseForm = document.getElementById('addExpenseForm');
        const transactionList = document.getElementById('transaction-list');
        const dateInput = document.getElementById('exp-date');

        // Automatically set the date input to today's date
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        addExpenseForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const desc = document.getElementById('exp-desc').value;
            const amount = parseFloat(document.getElementById('exp-amount').value).toFixed(2);
            const category = document.getElementById('exp-category').value;
            const expenseDate = document.getElementById('exp-date').value;
            const type = document.getElementById('exp-type').value;

            // Format based on CREDIT or DEBIT
            const isCredit = type === 'CREDIT';
            const sign = isCredit ? '+' : '-';
            const color = isCredit ? '#10b981' : '#ef4444';
            
            // Create a 2-letter icon from the category name instead of emojis
            const iconText = category.substring(0, 2).toUpperCase();

            const li = document.createElement('li');
            li.className = 'transaction-item new-item';
            li.innerHTML = `
                <div class="transaction-info">
                    <div class="transaction-icon">${iconText}</div>
                    <div class="transaction-details">
                        <h4>${desc}</h4>
                        <span class="transaction-date">${expenseDate}</span>
                    </div>
                </div>
                <span class="transaction-amount" style="color: ${color};">${sign}₹${amount}</span>
            `;
            
            // Insert at the top of the list
            transactionList.insertBefore(li, transactionList.firstChild);
            
            // Clear form (except for date and type)
            document.getElementById('exp-desc').value = '';
            document.getElementById('exp-amount').value = '';
            document.getElementById('exp-category').value = '';
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', function() {
            window.location.href = 'Login.html';
        });
    </script>
</body>
</html>
