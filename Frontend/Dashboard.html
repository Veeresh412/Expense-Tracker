<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="dashboard-container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="logo">
                <span class="logo-icon">💸</span>
                <h2>Expense Tracker</h2>
            </div>
            <div class="nav-actions">
                <span id="welcome-message">Welcome, User</span>
                <button onclick="window.location.href='Analytics.html'" class="btn-primary" style="padding: 10px 20px; font-size: 16px; margin: 0 10px;">Analytics</button>
                <button id="logout-btn" class="btn-secondary">Log Out</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Top Section: Summary Cards -->
            <div class="summary-cards">
                <div class="glass-card summary-card">
                    <h3>Net Spending</h3>
                    <h1 class="amount" id="net-spending">₹0</h1>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
                    </div>
                    <p class="limit-text" id="limit-text">Loading...</p>
                </div>
                
                <div class="glass-card summary-card">
                    <h3>Quick Add Expense</h3>
                    <form id="addExpenseForm" class="quick-add-form">
                        <div class="input-row">
                            <input type="text" id="exp-desc" placeholder="Description" required>
                            <input type="number" id="exp-amount" placeholder="₹ Amount" min="0" step="1" required>
                        </div>
                        <div class="input-row">
                            <select id="exp-type" required>
                                <option value="DEBIT" selected>Debit (-)</option>
                                <option value="CREDIT">Credit (+)</option>
                            </select>
                            <input type="date" id="exp-date" required>
                        </div>
                        <div class="input-row">
                            <input type="text" id="exp-category" placeholder="Category (e.g. Food)" required>
                            <button type="submit" class="btn-primary">Add</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Bottom Section: Transactions -->
            <div class="glass-card transactions-card">
                <h3>Recent Transactions</h3>
                <ul class="transaction-list" id="transaction-list">
                    <!-- Placeholder Data to show you how it looks -->
                    <li class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-icon">EN</div>
                            <div class="transaction-details">
                                <h4>Netflix Subscription</h4>
                                <span class="transaction-date">Yesterday</span>
                            </div>
                        </div>
                        <span class="transaction-amount" style="color: #ef4444;">-₹650</span>
                    </li>
                    <li class="transaction-item">
                        <div class="transaction-info">
                            <div class="transaction-icon">OT</div>
                            <div class="transaction-details">
                                <h4>Split Bill (Rahul)</h4>
                                <span class="transaction-date">Monday</span>
                            </div>
                        </div>
                        <span class="transaction-amount" style="color: #10b981;">+₹1200</span>
                    </li>
                </ul>
            </div>
        </main>
    </div>

    <script>
        // 1. Auth Check
        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = "Login.html";
        }

        const addExpenseForm = document.getElementById('addExpenseForm');
        const transactionList = document.getElementById('transaction-list');
        const dateInput = document.getElementById('exp-date');
        const welcomeMessage = document.getElementById('welcome-message');
        const netSpendingEl = document.getElementById('net-spending');
        const progressBarEl = document.getElementById('progress-bar');
        const limitTextEl = document.getElementById('limit-text');

        // Automatically set the date input to today's date
        dateInput.value = new Date().toISOString().split('T')[0];

        let userLimit = 10000; // default

        // 2. Fetch Data from Backend
        async function loadDashboard() {
            try {
                // Fetch User Info
                const userRes = await fetch(`http://localhost:8080/api/user/${userId}`);
                if (userRes.ok) {
                    const user = await userRes.json();
                    welcomeMessage.innerText = `Welcome, ${user.userName}!`;
                    userLimit = user.limit;
                }

                // Fetch Expenses
                const expRes = await fetch(`http://localhost:8080/api/expenses/${userId}`);
                if (expRes.ok) {
                    const expenses = await expRes.json();
                    renderDashboard(expenses);
                }
            } catch (error) {
                console.error("Error fetching dashboard data:", error);
            }
        }

        // 3. Render and Calculate
        function renderDashboard(expenses) {
            // Clear existing list
            transactionList.innerHTML = '';
            
            let totalDebits = 0;
            let totalCredits = 0;

            // Render Items
            expenses.forEach(exp => {
                // Arithmetic
                if (exp.type === 'CREDIT') {
                    totalCredits += parseFloat(exp.amount);
                } else {
                    totalDebits += parseFloat(exp.amount);
                }

                const isCredit = exp.type === 'CREDIT';
                const sign = isCredit ? '+' : '-';
                const color = isCredit ? '#10b981' : '#ef4444';
                const iconText = (exp.category || 'NA').substring(0, 2).toUpperCase();

                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <div class="transaction-info">
                        <div class="transaction-icon">${iconText}</div>
                        <div class="transaction-details">
                            <h4>${exp.description || 'Unknown'}</h4>
                            <span class="transaction-date">${exp.date || 'No Date'}</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span class="transaction-amount" style="color: ${color};">${sign}₹${exp.amount}</span>
                        <button onclick="deleteExpense(${exp.expId})" class="delete-btn" title="Delete">🗑️</button>
                    </div>
                `;
                // Insert at top to show newest first
                transactionList.insertBefore(li, transactionList.firstChild);
            });

            // Calculate Net Spending
            const netSpending = totalDebits - totalCredits;
            
            if (netSpending < 0) {
                // In abundance!
                const abundanceAmount = Math.abs(netSpending).toFixed(2);
                netSpendingEl.innerText = `+₹${abundanceAmount}`;
                netSpendingEl.style.color = '#10b981';
                
                progressBarEl.style.width = '0%';
                progressBarEl.style.backgroundColor = '#10b981';
                limitTextEl.innerText = `You are ₹${abundanceAmount} in abundance! (Limit: ₹${userLimit})`;
            } else {
                // Normal spending
                netSpendingEl.innerText = `₹${netSpending.toFixed(2)}`;
                netSpendingEl.style.color = 'var(--text-main)';
                
                let percent = (netSpending / userLimit) * 100;
                if (percent > 100) percent = 100; // Cap visually at 100%
                
                progressBarEl.style.width = `${percent}%`;
                progressBarEl.style.backgroundColor = percent > 90 ? '#ef4444' : 'var(--primary)';
                limitTextEl.innerText = `${percent.toFixed(1)}% of your ₹${userLimit} limit`;
            }
        }

        // 4. Handle Form Submission to Backend
        addExpenseForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newExpense = {
                description: document.getElementById('exp-desc').value,
                amount: parseFloat(document.getElementById('exp-amount').value),
                category: document.getElementById('exp-category').value,
                date: document.getElementById('exp-date').value,
                type: document.getElementById('exp-type').value
            };

            try {
                const res = await fetch(`http://localhost:8080/api/expenses/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newExpense)
                });
                
                if (res.ok) {
                    // Clear form inputs
                    document.getElementById('exp-desc').value = '';
                    document.getElementById('exp-amount').value = '';
                    document.getElementById('exp-category').value = '';
                    
                    // Reload dashboard to get fresh data from database
                    loadDashboard();
                }
            } catch (error) {
                console.error("Failed to add expense", error);
            }
        });

        // 5. Delete Expense
        async function deleteExpense(expId) {
            if (!confirm("Are you sure you want to delete this transaction?")) return;
            
            try {
                const res = await fetch(`http://localhost:8080/api/expenses/${expId}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    loadDashboard(); // Reload dashboard to update math and UI
                }
            } catch (error) {
                console.error("Failed to delete", error);
            }
        }

        // 6. Logout
        document.getElementById('logout-btn').addEventListener('click', function() {
            localStorage.removeItem('userId');
            window.location.href = 'Login.html';
        });

        // Initial Load
        loadDashboard();
    </script>
</body>
</html>
